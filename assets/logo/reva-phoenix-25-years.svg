<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8a84e"/>
      <stop offset="25%" stop-color="#fdf3b0"/>
      <stop offset="50%" stop-color="#b88229"/>
      <stop offset="75%" stop-color="#fae98f"/>
      <stop offset="100%" stop-color="#aa7523"/>
    </linearGradient>

    <radialGradient id="goldPlate" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="40%" stop-color="#eec874"/>
      <stop offset="75%" stop-color="#d7a13d"/>
      <stop offset="100%" stop-color="#b67e20"/>
    </radialGradient>

    <linearGradient id="beveledEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#784e0e"/>
      <stop offset="30%" stop-color="#d39f37"/>
      <stop offset="70%" stop-color="#fff2a8"/>
      <stop offset="100%" stop-color="#8b5b12"/>
    </linearGradient>

    <linearGradient id="ribbonLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d89f28"/>
      <stop offset="35%" stop-color="#ffea6c"/>
      <stop offset="70%" stop-color="#c78c18"/>
      <stop offset="100%" stop-color="#92600a"/>
    </linearGradient>

    <linearGradient id="ribbonRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d89f28"/>
      <stop offset="35%" stop-color="#ffea6c"/>
      <stop offset="70%" stop-color="#c78c18"/>
      <stop offset="100%" stop-color="#92600a"/>
    </linearGradient>

    <radialGradient id="innerCream" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fbf6ea"/>
      <stop offset="100%" stop-color="#ece2ca"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="35" flood-color="#d4a028" flood-opacity="0.4"/>
    </filter>

    <filter id="subtleInner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Path for circular text (Radius 252, centered at 500,480) -->
    <!-- Start at bottom (500, 732) and go clockwise -->
    <path id="textArcPath" d="M 500,732 A 252,252 0 1,1 499.9,732" fill="none"/>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- 1. RIBBONS AT THE BOTTOM -->
    <!-- Left Ribbon Tail -->
    <path d="M 495, 700 L 230, 920 L 335, 1070 L 405, 960 L 490, 1060 L 495, 750 Z" 
          fill="url(#ribbonLeftGrad)" stroke="#9e6c13" stroke-width="1.5" />
    <path d="M 495, 700 L 230, 920 L 335, 1070 L 405, 960 L 490, 1060 L 495, 750 Z" 
          fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />

    <!-- Right Ribbon Tail (Symmetric) -->
    <path d="M 505, 700 L 770, 920 L 665, 1070 L 595, 960 L 510, 1060 L 505, 750 Z" 
          fill="url(#ribbonRightGrad)" stroke="#9e6c13" stroke-width="1.5" />
    <path d="M 505, 700 L 770, 920 L 665, 1070 L 595, 960 L 510, 1060 L 505, 750 Z" 
