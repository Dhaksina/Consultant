<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" width="100%" height="100%">
  <defs>
    <linearGradient id="nlRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3840"/>
      <stop offset="100%" stop-color="#cc1118"/>
    </linearGradient>
    <linearGradient id="nlSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="seamsPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555d67"/>
      <stop offset="100%" stop-color="#3a4149"/>
    </linearGradient>
    <filter id="nlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g transform="translate(170, 0)">
    <!-- Top Needle & Orbital Ring -->
    <g transform="translate(0, 36)" filter="url(#nlShadow)">
      <!-- Orbital Silver Rings / Ellipse -->
      <ellipse cx="0" cy="8" rx="34" ry="12" fill="none" stroke="url(#nlSilver)" stroke-width="3" transform="rotate(-15)"/>
      <ellipse cx="0" cy="8" rx="20" ry="7" fill="none" stroke="#64748b" stroke-width="1.8" transform="rotate(-15)"/>
      <!-- Red Compass Needle / Pointer -->
      <path d="M 0 -34 L 8 4 L 0 1 L -8 4 Z" fill="url(#nlRed)" stroke="#ffffff" stroke-width="0.8"/>
      <path d="M 0 -34 L 0 1 L -8 4 Z" fill="#990b10"/>
      <!-- Pivot Point -->
      <circle cx="0" cy="1" r="3.5" fill="#ffffff" stroke="#cc1118" stroke-width="1.5"/>
    </g>

    <!-- "NORTHLAB" Typography: Bold, Extended, Red with Crisp White Detail -->
    <text x="0" y="98" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" 
          font-weight="900" 
          font-size="44" 
          fill="url(#nlRed)" 
          letter-spacing="2.5px"
          stroke="#ffffff"
          stroke-width="0.75"
          filter="url(#nlShadow)">NORTHLAB</text>

    <!-- "SEAMS" Badge & Typography -->
    <g transform="translate(-110, 112)" filter="url(#nlShadow)">
      <rect x="0" y="0" width="220" height="30" rx="3" fill="url(#seamsPill)" stroke="url(#nlSilver)" stroke-width="1.5"/>
      <text x="110" y="21" 
            text-anchor="middle"
            font-family="system-ui, -apple-system, Arial, sans-serif" 
            font-weight="800" 
            font-style="italic" 
            font-size="20" 
            fill="#ffffff" 
            letter-spacing="5px">SEAMS</text>
    </g>
  </g>
</svg>
