    <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="24" fill="#111111" letter-spacing="3.5">
      <textPath href="#textArcPath" startOffset="50%" text-anchor="middle">
        ★ REVA PHOENIX LABS &amp; CONSULTANTS PVT. LTD. ★
      </textPath>
